<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Online Banking</title>
    {% load static %}
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background: url("{% static '/cards.jpeg' %}") no-repeat center center/cover;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            margin-top: 30px;
        }
        .auth-links a {
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
            color: #3b5998;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Online Banking</h1>
        <p>Securely manage your finances anytime, anywhere.</p>
        <div class="auth-links">
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Sign Up</a>
        </div>
    </div>
</body>
</html>
